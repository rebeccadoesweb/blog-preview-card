<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="Frontend Mentor - Blog preview card">
  <meta name="keywords" content="HTML, CSS">
  <meta name="author" content="Rebecca Padgett">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <!-- !css -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <main class="card">
    <img class="blog-img" src="./assets/images/illustration-article.svg" width="336" height="201" alt="">
    <article class="blog-content">
      <a href="#" class="blog-category">Learning</a>
      <time datetime="2023-12-21">Published 21 Dec 2023</time>
      <h1 class="blog-title">HTML & CSS foundations</h1>
      <p class="blog-description">These languages are the backbone of every website, defining structure, content, and
        presentation.</p>
    </article>
    <div class="author">
      <img class="author-img" src="./assets/images/image-avatar.webp" width="64" height="65"
        alt="headshot of Greg Hooper">
      <h2 class="author-name"> Greg Hooper</h2>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Rebecca Padgett</a>.
  </footer>
</body>

</html>
